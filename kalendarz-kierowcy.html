function summary(){let a=sums(),values=[String(a.days),human(a.total),human(a.drive),human(a.other)];V.innerHTML=`<button class="nav" id="back">← Kalendarz</button><h3 style="margin:17px 0">Zestawienie — ${mo[M]} ${Y}</h3><div style="display:grid;gap:10px">${categories.map(([id,name],i)=>`<button class="sumcard" data-cat="${id}"><div class="muted" style="font-size:14px">${name}</div><div class="sumvalue">${values[i]}</div><div class="muted" style="margin-top:8px">Dotknij, aby zobaczyć daty ›</div></button>`).join('')}</div><button class="primary" id="pdfDownload" style="margin-top:15px;background:#226cb7">Pobierz raport PDF</button><button class="primary" id="return" style="margin-top:9px">Wróć do kalendarza</button>`;V.querySelector('#back').onclick=calendar;V.querySelector('#return').onclick=calendar;V.querySelector('#pdfDownload').onclick=exportMonthPDF;V.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>detailCat(b.dataset.cat))}

function mask(inp,initial,callback,duration=false){let chars=String(initial||'').replace(/\D/g,'').slice(0,4).padEnd(4,'_').split(''),pos=0;function caret(){let p=pos>=2?pos+1:pos;try{inp.setSelectionRange(p,p)}catch(e){}}function paint(){inp.value=chars.slice(0,2).join('')+':'+chars.slice(2).join('');callback(chars.includes('_')?'':chars.join(''))}function add(s){for(let c of String(s).replace(/\D/g,'')){if(pos>=4)break;if(!duration&&pos===0&&+c>2)continue;if(!duration&&pos===1&&chars[0]==='2'&&+c>3)continue;if(pos===2&&+c>5)continue;chars[pos++]=c}paint();caret()}inp.addEventListener('focus',()=>{pos=0;requestAnimationFrame(caret)});inp.addEventListener('click',()=>{let p=inp.selectionStart||0;pos=Math.max(0,Math.min(4,p>2?p-1:p));requestAnimationFrame(caret)});inp.addEventListener('beforeinput',e=>{if(e.inputType==='insertText'&&e.data!=null){e.preventDefault();add(e.data)}else if(['deleteContentBackward','deleteContentForward'].includes(e.inputType)){e.preventDefault();if(e.inputType==='deleteContentBackward')pos=Math.max(0,pos-1);if(pos<4)chars[pos]='_';paint();caret()}else if(e.inputType==='insertFromPaste'){e.preventDefault();add(e.dataTransfer?.getData('text')||'')}});inp.addEventListener('paste',e=>{e.preventDefault();chars=['_','_','_','_'];pos=0;add(e.clipboardData?.getData('text')||'')});inp.addEventListener('input',()=>{let s=inp.value.replace(/\D/g,'').slice(0,4);chars=s.padEnd(4,'_').split('');pos=s.length;paint();caret()});paint()}
function details(){let k=key(selected),r=draft,active=work(r),exists=!!db[k];V.innerHTML=`<button class="nav" id="back">← Kalendarz</button><h3>${selected} ${mo[M].toLowerCase()} ${Y}</h3><div style="display:grid;gap:7px">${[['work','Dzień pracy'],['return','Powrót do domu'],['depart','Wyjazd z domu'],['home','Pobyt w domu'],['rest','Odpoczynek tygodniowy poza domem']].map(([t,n])=>`<label class="choice"><input type="radio" name="type" value="${t}" ${r.type===t?'checked':''}>${icon(sym(t))}<span>${n}</span></label>`).join('')}</div>${active?`<div class="panel" style="margin-top:12px"><strong>Godziny dniówki</strong><label class="muted" style="display:block;margin-top:9px">Data rozpoczęcia zmiany</label><select id="startOffset" style="width:100%;padding:11px;background:white;border:1px solid #d9dee7;border-radius:9px;font:inherit"><option value="0" ${r.startOffset!==-1?'selected':''}>${selected} ${mo[M].toLowerCase()} (dzień kafelka)</option><option value="-1" ${r.startOffset===-1?'selected':''}>Poprzedniego dnia — ${new Date(dDate(k).getTime()-86400000).toLocaleDateString('pl-PL')}</option></select><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px"><div><label class="muted">Rozpoczęcie</label><input class="clock" id="start" inputmode="numeric"></div><div><label class="muted">Zakończenie</label><input class="clock" id="end" inputmode="numeric"></div></div><div id="calc" style="font-size:13px;margin-top:9px"></div></div><div class="panel" style="margin-top:12px"><strong>Godziny kierowcy</strong><p class="muted">Te pola możesz pozostawić puste.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label class="muted">Czas prowadzenia pojazdu</label><input class="clock" id="drive" inputmode="numeric"></div><div><label class="muted">Czas innej pracy</label><input class="clock" id="other" inputmode="numeric"></div></div></div><p style="font-size:13px">Czy miałeś co najmniej 3 godziny nieprzerwanego odpoczynku?</p><div styl function refresh(){let old=db[k];db[k]={...r};let p=interval(k,r),a=alerts(k,r),l=left(k,r),q=right(k,r);if(old)db[k]=old;else delete db[k];V.querySelector('#rests').innerHTML=`<strong>Odpoczynki</strong><p>Tygodniowy przed pracą: <b style="color:#2475b8">${l===null?'—':human(l)}</b></p><p>Po dniówce: <b style="color:${a.short?'#d32222':'#2475b8'}">${q===null?'—':human(q)}</b></p>`;if(active)V.querySelector('#calc').innerHTML=p&&p.b!==null?`Dniówka: <b>${human(Math.round((p.b-p.a)/60000))}</b><div class="muted">${new Date(p.a).toLocaleString('pl-PL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} → ${new Date(p.b).toLocaleString('pl-PL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>${a.short?'<div class="warn">! Przerwa krótsza niż 9 godzin.</div>':''}${(cycleInfo(p.b).deadline!==null?`<div class="muted">Do rozpoczęcia następnego tygodniowego: ${human(Math.max(0,Math.round((cycleInfo(p.b).deadline-p.b)/60000)))}</div>`:'<div class="muted">144 h: brak pewnego początku cyklu.</div>')+`<div class="${a.nineLimit?'warn':'muted'}">Skrócone odpoczynki w cyklu: ${a.nineUsed+(a.nineCurrent?1:0)} z 3${a.nineCurrent?' (ta dniówka zalicza skrócenie)':''}${a.nineLimit?' — limit wyczerpany':''}${a.unknownCycle?' · Początek cyklu nieznany; wynik orientacyjny':''}.</div>`+a.hard.map(t=>`<div class="warn">! ${t}</div>`).join('')}`:valid(r.start)?'<b style="color:#2475b8">Rozpoczęcie gotowe do zapisu.</b>':'Wpisz godzinę rozpoczęcia.'}

let lang=(localStorage.getItem('gbcmr-language')||'pl');
let translating=false;
const base=['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
function translateText(s){
 if(lang==='pl'||!DICT[lang])return s;
 const tr=DICT[lang],trim=s.trim();if(!trim)return s;
 let t=tr[trim];
 if(!t){t=trim;
  // Longest phrases first; text nodes can combine a fixed phrase and dynamic numbers.
  for(const [from,to] of Object.entries(tr).sort((a,b)=>b[0].length-a[0].length)){
   if(from==='min'||from==='godz.'||from.length===2)continue;
   t=t.split(from).join(to);
  }
  for(const [from,to] of Object.entries(tr).filter(x=>x[0].length===2||x[0]==='godz.'||x[0]==='min')){
   let escaped=from.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
   t=t.replace(new RegExp('(^|[\\s,])'+escaped+'(?=$|[\\s,.])','g'),(_,a)=>a+to);
  }
 }
 return s.replace(trim,t);
}
function refresh(){
 if(translating)return; translating=true;
 try{
  document.documentElement.lang=lang;
  const root=document.getElementById('app');if(!root)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  for(const n of nodes){
   if(!n.__gbPolishText)n.__gbPolishText=n.nodeValue;
   const val=translateText(n.__gbPolishText);if(n.nodeValue!==val)n.nodeValue=val;
  }
  document.title=(DICT[lang]||DICT.pl)['Kalendarz kierowcy']+' — Gigabajt CMR';
 }finally{translating=false}
}
function switchLang(code){if(!DICT[code])code='pl';lang=code;refresh()}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==window.parent)return;if(e.data&&e.data.type==='gigabajt-calendar-language')switchLang(e.data.lang)});
const obs=new MutationObserver(()=>{if(translating)return;refresh()});
obs.observe(document.getElementById('app'),{childList:true,subtree:true,characterData:true});
switchLang(lang);
})();
