center;border:1px solid #dbe2eb;border-radius:13px;background:#fff;color:#17243b;padding:20px 12px}.sumvalue{font-size:25px;font-weight:800;margin-top:8px}.detailrow{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #dbe2eb;padding:13px 9px;font-size:13px}.warn{margin-top:8px;padding:8px;color:#c41616;border:1px solid #d4232366;border-radius:8px;font-size:12px}
</style></head><body><main id="app"></main><script>
(()=>{'use strict';
const V=document.getElementById('app'),P=n=>String(n).padStart(2,'0'),H=3600000,mo=['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'],KEY='gigabajt-cmr-kalendarz-v23';
let Y=2026,M=9,selected=0,draft=null,db={},anchor='2026-10-12T06:00',ws='2026-10-18T06:00',we='2026-10-19T06:00';
try{let saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&saved.db){db=saved.db;anchor=saved.anchor||anchor;ws=saved.ws||ws;we=saved.we||we}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({db,anchor,ws,we}))}catch(e){}}
const key=d=>`${Y}-${P(M+1)}-${P(d)}`,dDate=k=>{let a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])},work=r=>r&&(r.type==='work'||r.type==='return'),valid=s=>/^\d{4}$/.test(s||'')&&+s.slice(0,2)<24&&+s.slice(2)<60,dur=s=>/^\d{4}$/.test(s||'')&&+s.slice(2)<60?+s.slice(0,2)*60+ +s.slice(2):null,dt=s=>{let x=s?new Date(s):null;return x&&Number.isFinite(+x)?+x:null},fmt=s=>valid(s)?s.slice(0,2)+':'+s.slice(2):'',human=n=>`${Math.floor(n/60)} godz. ${P(n%60)} min`;
const paths={truck:'<rect x="2" y="6" width="13" height="10" rx="1"/><path d="M15 9h4l3 3v4h-7"/><circle cx="6.5" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>',home:'<path d="m3 11 9-8 9 8"/><path d="M5 10v11h14V10"/><path d="M9 21v-7h6v7"/>',bed:'<path d="M3 5v16M21 11v10M3 17h18v4M3 11h18v6M7 11V7h9v4"/>'};
function icon(t,n=16){if(t==='return')return `<span style="display:inline-flex">${icon('truck',12)}${icon('home',12)}</span>`;return `<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="${t==='truck'?'#2277bc':t==='home'?'#27824d':'#17243b'}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths[t]}</svg>`}const sym=t=>t==='work'?'truck':t==='return'?'return':t==='home'?'home':'bed';
function interval(k,r){if(!work(r)||!valid(r.start))return null;let a=dDate(k);a.setHours(+r.start.slice(0,2),+r.start.slice(2));let b=null;if(valid(r.end)){b=dDate(k);b.setHours(+r.end.slice(0,2),+r.end.slice(2));if(b<=a)b.setDate(b.getDate()+1)}return {a:+a,b:b===null?null:+b}}
function shifts(){return Object.entries(db).map(([k,r])=>({k,r,p:interval(k,r)})).filter(e=>e.p).map(e=>({...e.p,k:e.k,r:e.r})).sort((a,b)=>a.a-b.a)}
function week(){let a=dt(ws),b=dt(we);return a!==null&&b!==null&&b-a>=24*H?{a,b}:null}
function gap(k,r){let p=interval(k,r);if(!p||p.b===null)return null;let n=shifts().find(x=>x.k!==k&&x.a>=p.b);return n?Math.round((n.a-p.b)/60000):null}
function left(k,r){let p=interval(k,r),w=week();return p&&w&&p.a===w.b?Math.round((w.b-w.a)/60000):null}
function right(k,r){let p=interval(k,r),d=dDate(k),mid=+new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);if(p){if(p.b===null)return null;if(r.type==='return')return p.b<mid?Math.round((mid-p.b)/60000):null;let g=gap(k,r);return g===null?null:g<=1440?g:p.b<mid?Math.round((mid-p.b)/60000):null}if(!r||!['rest','home'].includes(r.type))return null;let prev=shifts().filter(x=>x.b!==null&&x.b<=+d).at(-1);if(!prev)return null;let next=shifts().find(x=>x.k!==prev.k&&x.a>=prev.b);if(next&&next.a<mid)return null;return Math.round((mid-prev.b)/60000)}
function alerts(k,r){let p=interval(k,r),out={hard:[],short:false};if(!p||p.b===null)return out;let w=week(),base=dt(anchor),ref=w&&p.a>=w.b?w.b:base,g=gap(k,r);if(w&&p.a<w.b&&p.b>w.a)out.hard.push('Praca nakłada się na odpoczynek tygodniowy.');if(ref!==null&&p.b>ref+144*H&&!(w&&w.a>=ref&&w.a<=ref+144*H&&p.a<=w.a))out.hard.push('Przekroczona granica 144 godzin.');let used=0,es=shifts().filter(x=>x.b!==null);for(let i=0;i<es.length-1;i++){let a=es[i],b=es[i+1],n=(b.a-a.b)/H;if(ref!==null&&a.a>=ref&&a.a<p.a&&n>=9&&n<11&&a.r.three!==true)used++}if(g!==null&&g>=540&&g<660&&r.three!==true&&used>=3)out.hard.push('Czwarty potencjalny skrócony odpoczynek (9–10 h).');out.short=g!==null&&g>=0&&g<540&&r.type!=='return';return out}
function color(k,r){let p=interval(k,r),a=alerts(k,r);if(a.hard.length)return 'hard';if(!p||p.b===null)return '';let n=(p.b-p.a)/60000;return n>900?'red':n>780?'yellow':'green'}
function calendar(){let off=(new Date(Y,M,1).getDay()+6)%7,n=new Date(Y,M+1,0).getDate(),cells='';for(let i=0;i<Math.ceil((off+n)/7)*7;i++){let d=i-off+1;if(d<1||d>n){cells+='<span></span>';continue}let k=key(d),r=db[k],a=alerts(k,r),l=left(k,r),rr=right(k,r),p=interval(k,r);cells+=`<button class="tile ${color(k,r)}" data-day="${d}">${l!==null?`<span class="left">${Math.floor(l/60)}h</span>`:''}${r?.three===true&&work(r)?'<span class="right bad">+3</span>':rr!==null&&rr>=60?`<span class="right ${a.short?'bad':''}">${Math.floor(rr/60)}h</span>`:''}${a.hard.length||a.short?'<span class="bang">!</span>':''}<span style="font-size:12px">${d}</span><span style="height:17px">${r?icon(sym(r.type)):''}</span>${p&&p.b===null?'<span class="started">START</span>':''}</button>`}let w=week();V.innerHTML=`<div class="top"><strong style="font-size:20px">Kalendarz kierowcy</strong><span>▦</span></div><div class="top"><button class="nav" id="prev">‹</button><strong>${mo[M]} ${Y}</strong><button class="nav" id="next">›</button></div><div class="grid">${['Pn','Wt','Śr','Cz','Pt','So','Nd'].map(x=>`<span class="muted" style="text-align:center">${x}</span>`).join('')}${cells}</div><div style="display:flex;gap:13px;flex-wrap:wrap;margin:14px 0;font-size:12px"><span>${icon('truck')} Praca</span><span>${icon('bed')} Odpoczynek</span><span>${icon('home')} Dom</span></div><div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;font-size:12px"><span><b style="color:#36aa6b">●</b> do 13 h</span><span><b style="color:#dfb51c">●</b> 13–15 h</span><span><b style="color:#d42b2b">●</b> >15 h/alarm</span></div><button class="primary" id="summary">Zestawienie miesiąca</button><div class="panel" style="margin-top:13px"><div class="top" style="margin:0"><strong style="font-size:13px">Odpoczynek tygodniowy i 144 h</strong><button class="nav" id="settings">Ustaw</button></div><p class="muted" style="margin:8px 0 0">${w?'Tygodniowy: '+human(Math.round((w.b-w.a)/60000))+'. Nowy cykl od '+new Date(w.b).toLocaleString('pl-PL'):'Brak wpisanej pauzy tygodniowej'}</p></div>`;V.querySelector('#summary').onclick=summary;V.querySelector('#settings').onclick=settings;V.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selected=+b.dataset.day;draft={type:'work',start:'',end:'',drive:'',other:'',three:null,...(db[key(selected)]||{})};details()});for(let [id,z] of [['prev',-1],['next',1]])V.querySelector('#'+id).onclick=()=>{let d=new Date(Y,M+z,1);Y=d.getFullYear();M=d.getMonth();calendar()}}
const categories=[['days','Ukończone dniówki'],['total','Łączny czas dniówek'],['drive','Czas prowadzenia pojazdu'],['other','Czas innej pracy']];
function monthly(){let a=[];for(let d=1;d<=new Date(Y,M+1,0).getDate();d++){let k=key(d),r=db[k];if(!r)continue;let p=interval(k,r);a.push({d,r,span:p&&p.b!==null?Math.round((p.b-p.a)/60000):null,drive:dur(r.drive),other:dur(r.other)})}return a}

function summary(){let a=sums(),values=[String(a.days),human(a.total),human(a.drive),human(a.other)];V.innerHTML=`<button class="nav" id="back">← Kalendarz</button><h3 style="margin:17px 0">Zestawienie — ${mo[M]} ${Y}</h3><div style="display:grid;gap:10px">${categories.map(([id,name],i)=>`<button class="sumcard" data-cat="${id}"><div class="muted" style="font-size:14px">${name}</div><div class="sumvalue">${values[i]}</div><div class="muted" style="margin-top:8px">Dotknij, aby zobaczyć daty ›</div></button>`).join('')}</div><button class="primary" id="return" style="margin-top:15px">Wróć do kalendarza</button>`;V.querySelector('#back').onclick=calendar;V.querySelector('#return').onclick=calendar;V.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>detailCat(b.dataset.cat))}
function detailCat(id){let name=categories.find(x=>x[0]===id)?.[1];if(!name)return summary();let list=monthly().filter(x=>id==='days'||id==='total'?x.span!==null:x[id]!==null),a=sums(),value=id==='days'?String(a.days):human(a[id]);V.innerHTML=`<button class="nav" id="back">← Zestawienie miesiąca</button><h3>${name}</h3><div class="panel" style="text-align:center;margin-bottom:12px"><div class="muted">${mo[M]} ${Y}</div><div class="sumvalue">${value}</div></div><div class="panel" style="padding:3px 10px">${list.length?list.map(x=>`<div class="detailrow"><div><strong>${x.d} ${mo[M].toLowerCase()}</strong>${id==='days'||id==='total'?`<div class="muted">${fmt(x.r.start)}–${fmt(x.r.end)}</div>`:''}</div><b>${id==='days'?'1 dniówka':human(x[id==='total'?'span':id])}</b></div>`).join(''):'<p class="muted">Nie ma jeszcze wpisów.</p>'}</div><button class="primary" id="return" style="margin-top:14px">Wróć do czterech kafelków</button>`;V.querySelector('#back').onclick=summary;V.querySelector('#return').onclick=summary}
function mask(inp,initial,callback,duration=false){let chars=String(initial||'').replace(/\D/g,'').slice(0,4).padEnd(4,'_').split(''),pos=0;function caret(){let p=pos>=2?pos+1:pos;try{inp.setSelectionRange(p,p)}catch(e){}}function paint(){inp.value=chars.slice(0,2).join('')+':'+chars.slice(2).join('');callback(chars.includes('_')?'':chars.join(''))}function add(s){for(let c of String(s).replace(/\D/g,'')){if(pos>=4)break;if(!duration&&pos===0&&+c>2)continue;if(!duration&&pos===1&&chars[0]==='2'&&+c>3)continue;if(pos===2&&+c>5)continue;chars[pos++]=c}paint();caret()}inp.addEventListener('focus',()=>{pos=0;requestAnimationFrame(caret)});inp.addEventListener('click',()=>{let p=inp.selectionStart||0;pos=Math.max(0,Math.min(4,p>2?p-1:p));requestAnimationFrame(caret)});inp.addEventListener('beforeinput',e=>{if(e.inputType==='insertText'&&e.data!=null){e.preventDefault();add(e.data)}else if(['deleteContentBackward','deleteContentForward'].includes(e.inputType)){e.preventDefault();if(e.inputType==='deleteContentBackward')pos=Math.max(0,pos-1);if(pos<4)chars[pos]='_';paint();caret()}else if(e.inputType==='insertFromPaste'){e.preventDefault();add(e.dataTransfer?.getData('text')||'')}});inp.addEventListener('paste',e=>{e.preventDefault();chars=['_','_','_','_'];pos=0;add(e.clipboardData?.getData('text')||'')});inp.addEventListener('input',()=>{let s=inp.value.replace(/\D/g,'').slice(0,4);chars=s.padEnd(4,'_').split('');pos=s.length;paint();caret()});paint()}
function details(){let k=key(selected),r=draft,active=work(r),exists=!!db[k];V.innerHTML=`<button class="nav" id="back">← Kalendarz</button><h3>${selected} ${mo[M].toLowerCase()} ${Y}</h3><div style="display:grid;gap:7px">${[['work','Dzień pracy'],['return','Powrót do domu'],['home','Pobyt w domu'],['rest','Odpoczynek tygodniowy poza domem']].map(([t,n])=>`<label class="choice"><input type="radio" name="type" value="${t}" ${r.type===t?'checked':''}>${icon(sym(t))}<span>${n}</span></label>`).join('')}</div>${active?`<div class="panel" style="margin-top:12px"><strong>Godziny dniówki</strong><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px"><div><label class="muted">Rozpoczęcie</label><input class="clock" id="start" inputmode="numeric"></div><div><label class="muted">Zakończenie</label><input class="clock" id="end" inputmode="numeric"></div></div><div id="calc" style="font-size:13px;margin-top:9px"></div></div><div class="panel" style="margin-top:12px"><strong>Godziny kierowcy</strong><p class="muted">Te pola możesz pozostawić puste.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label class="muted">Czas prowadzenia pojazdu</label><input class="clock" id="drive" inputmode="numeric"></div><div><label class="muted">Czas innej pracy</label><input class="clock" id="other" inputmode="numeric"></div></div></div><p style="font-size:13px">Czy miałeś co najmniej 3 godziny nieprzerwanego odpoczynku?</p><div style="display:flex;gap:16px;font-size:13px"><label><input type="radio" name="three" value="yes" ${r.three===true?'checked':''}> Tak</label><label><input type="radio" name="three" value="no" ${r.three===false?'checked':''}> Nie</label></div><button class="secondary" id="saveStart" style="margin-top:13px">Zapisz rozpoczęcie</button><button class="primary" id="saveEnd" style="margin-top:9px">Zapisz zakończenie</button>`:'<button class="primary" id="saveDay" style="margin-top:13px">Zapisz dzień</button>'}<div class="panel" id="rests" style="margin-top:12px;font-size:13px"></div>${exists?'<button class="secondary" id="delete" style="margin-top:10px;color:#d32222">Usuń wpis z tego dnia</button>':''}<p class="muted" id="error"></p>`;V.querySelector('#back').onclick=calendar;
function refresh(){let old=db[k];db[k]={...r};let p=interval(k,r),a=alerts(k,r),l=left(k,r),q=right(k,r);if(old)db[k]=old;else delete db[k];V.querySelector('#rests').innerHTML=`<strong>Odpoczynki</strong><p>Tygodniowy przed pracą: <b style="color:#2475b8">${l===null?'—':human(l)}</b></p><p>Po dniówce: <b style="color:${a.short?'#d32222':'#2475b8'}">${q===null?'—':human(q)}</b></p>`;if(active)V.querySelector('#calc').innerHTML=p&&p.b!==null?`Dniówka: <b>${human(Math.round((p.b-p.a)/60000))}</b>${a.short?'<div class="warn">! Przerwa krótsza niż 9 godzin.</div>':''}${a.hard.map(t=>`<div class="warn">! ${t}</div>`).join('')}`:valid(r.start)?'<b style="color:#2475b8">Rozpoczęcie gotowe do zapisu.</b>':'Wpisz godzinę rozpoczęcia.'}
V.querySelectorAll('[name=type]').forEach(x=>x.onchange=()=>{r.type=x.value;details()});if(active){for(let f of ['start','end','drive','other'])mask(V.querySelector('#'+f),r[f],x=>{r[f]=x;refresh()},f==='drive'||f==='other');V.querySelectorAll('[name=three]').forEach(x=>x.onchange=()=>{r.three=x.value==='yes';refresh()});V.querySelector('#saveStart').onclick=()=>{if(!valid(r.start)){V.querySelector('#error').textContent='Wpisz pełną godzinę rozpoczęcia.';return}db[k]={...r,end:db[k]?.end||''};persist();calendar()};V.querySelector('#saveEnd').onclick=()=>{if(!valid(r.start)||!valid(r.end)){V.querySelector('#error').textContent='Wpisz rozpoczęcie i zakończenie.';return}db[k]={...r};persist();calendar()}}else V.querySelector('#saveDay').onclick=()=>{db[k]={type:r.type};persist();calendar()};if(exists)V.querySelector('#delete').onclick=()=>{delete db[k];persist();calendar()};refresh()}
function settings(){V.innerHTML=`<button class="nav" id="back">← Kalendarz</button><h3>Odpoczynek tygodniowy</h3>${[['anchor','Koniec poprzedniego tygodniowego',anchor],['ws','Początek odpoczynku',ws],['we','Koniec odpoczynku',we]].map(([id,name,val])=>`<label class="muted">${name}</label><input class="dt" id="${id}" type="datetime-local" value="${val}" style="margin:5px 0 12px">`).join('')}<button class="primary" id="save">Zapisz</button><p class="muted" id="error"></p>`;V.querySelector('#back').onclick=calendar;V.querySelector('#save').onclick=()=>{let a=V.querySelector('#anchor').value,b=V.querySelector('#ws').value,c=V.querySelector('#we').value;if(dt(a)===null||dt(b)===null||dt(c)===null||dt(c)-dt(b)<24*H){V.querySelector('#error').textContent='Minimum 24 godziny odpoczynku tygodniowego.';return}anchor=a;ws=b;we=c;persist();calendar()}}
calendar();
// Dostosuj wysokość ramki do aktualnego widoku, także po wejściu w szczegóły.
function reportHeight(){
  const h=Math.ceil(Math.max(document.body.scrollHeight,document.documentElement.scrollHeight,V.getBoundingClientRect().bottom))+6;
  window.parent.postMessage({type:'gigabajt-calendar-height',height:h},window.location.origin);
}

setTimeout(reportHeight,100);
})();

function translateText(s){
 if(lang==='pl'||!DICT[lang])return s;
 const tr=DICT[lang],trim=s.trim();if(!trim)return s;
 let t=tr[trim];
 if(!t){t=trim;
  // Longest phrases first; text nodes can combine a fixed phrase and dynamic numbers.
  for(const [from,to] of Object.entries(tr).sort((a,b)=>b[0].length-a[0].length)){
   if(from==='min'||from==='godz.'||from.length===2)continue;
   t=t.split(from).join(to);
  }

   let escaped=from.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
   t=t.replace(new RegExp('(^|[\\s,])'+escaped+'(?=$|[\\s,.])','g'),(_,a)=>a+to);
  }
 }
 return s.replace(trim,t);
}
function refresh(){
 if(translating)return; translating=true;
 try{
  document.documentElement.lang=lang;
  const root=document.getElementById('app');if(!root)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  for(const n of nodes){
   if(!n.__gbPolishText)n.__gbPolishText=n.nodeValue;

 }finally{translating=false}
}

})();
