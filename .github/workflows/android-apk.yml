name: Gigabajt CMR - podpisane APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Zbuduj podpisany APK
        env:
          CMR_KEYSTORE_B64: ${{ secrets.CMR_KEYSTORE_B64 }}
          CMR_SIGNING_PASSWORD: ${{ secrets.CMR_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CMR_KEYSTORE_B64"
          test -n "$CMR_SIGNING_PASSWORD"
          printf '%s' "$CMR_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cmr-release.p12"
          export CMR_KEYSTORE_FILE="$RUNNER_TEMP/cmr-release.p12"
          chmod 600 "$CMR_KEYSTORE_FILE"
          gradle :app:assembleRelease --no-daemon
          test -s app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Gigabajt-CMR-podpisany
          path: app/build/outputs/apk/release/app-release.apk

      - name: Opublikuj aktualizacje
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"             "app/build/outputs/apk/release/app-release.apk#Gigabajt-CMR-$GITHUB_REF_NAME.apk"             --verify-tag             --title "Gigabajt CMR $GITHUB_REF_NAME"             --notes "Poprawiono zapis PDF z kalendarza kierowcy. Dodano aktualizator z paskiem postepu 0-100%."
